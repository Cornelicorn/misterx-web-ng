version: 2

registries:
  # volucra-django-base is a private repository, the token needs read access to its contents
  volucra-django-base:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.VOLUCRA_DJANGO_BASE_TOKEN}}

updates:
  - package-ecosystem: "uv"
    directory: "/"
    registries:
      - volucra-django-base
    schedule:
      interval: "weekly"
    # Raise the upper bounds in pyproject.toml when a new major version comes out, versions within the
    # bounds only update uv.lock
    versioning-strategy: "widen"
