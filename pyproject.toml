[project]
name = "mister-x-web-ng"
version = "0.1.0"
description = "WebApp to use for running a MisterX game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crispy-bootstrap5>=2024.10,<2027",
    "django>=5.1.7,<7",
    "django-crispy-forms>=2.3,<3",
    "django-debug-toolbar>=5.0.1,<9",
    "django-filter>=25.1,<27",
    "django-guardian>=2.4.0,<4",
    "django-tables2>=2.7.5,<4",
    "psycopg2-binary>=2.9.10,<3",
    "python-magic>=0.4.27,<0.5",
    "social-auth-app-django>=5.4.3,<8",
    "uwsgi>=2.0.28,<3",
    "volucra-django-base",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.3,<7",
    "djhtml>=3.0.7,<4",
    "djlint>=1.36.4,<2",
    "mypy>=1.15.0,<3",
    "ruff>=0.9.10,<0.18",
]

[[tool.mypy.overrides]]
module = [
    "crispy_forms.*",
    "debug_toolbar.*",
    "django_tables2.*",
    "guardian.*",
    "django_filters.*",
]
ignore_missing_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.ruff]
lint.extend-select = ["I", "UP", "FURB"]
line-length = 129
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "misterx_root.settings"

[tool.djlint]
blank_line_before_tag="extends,block"
blank_line_after_tag="load,extends,endblock"
format_attribute_template_tags=true
format_css=true
format_js=true
# Ignore meta description and tags
ignore="H030,H031"
max_blank_lines=1
profile="django"
max_attribute_length=80


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misterx", "src/misterx_root", "src/templates"]

[tool.uv.sources]
volucra-django-base = { git = "https://github.com/Cornelicorn/volucra-django-base", rev = "841289ca021ea5a6019a995e06852576623234fa" }
