[project]
name = "mister-x-web-ng"
version = "0.1.0"
description = "WebApp to use for running a MisterX game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crispy-bootstrap5>=2026.9,<2026.10",
    "django>=6.1.2,<6.2",
    "django-crispy-forms>=2.7,<3",
    "django-debug-toolbar>=8.0.0,<9",
    "django-filter>=26.2,<27",
    "django-guardian>=3.5.2,<4",
    "django-tables2>=3.0.1,<4",
    "psycopg2-binary>=2.9.13,<2.10",
    "python-magic>=0.4.27,<0.5",
    "social-auth-app-django>=7.2.0,<8",
    "uwsgi>=2.0.31,<2.1",
    "volucra-django-base",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2,<6.2",
    "djhtml>=3.0.11,<4",
    "djlint>=1.47.1,<2",
    "mypy>=2.4.1,<2.5",
    "ruff>=0.17.3,<0.18",
]

[[tool.mypy.overrides]]
module = [
    "crispy_forms.*",
    "debug_toolbar.*",
    "django_tables2.*",
    "guardian.*",
    "django_filters.*",
]
ignore_missing_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.ruff]
lint.extend-select = ["I", "UP", "FURB"]
line-length = 129
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "misterx_root.settings"

[tool.djlint]
blank_line_before_tag="extends,block"
blank_line_after_tag="load,extends,endblock"
format_attribute_template_tags=true
format_css=true
format_js=true
# Ignore meta description and tags
ignore="H030,H031"
max_blank_lines=1
profile="django"
max_attribute_length=80


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misterx", "src/misterx_root", "src/templates"]

[tool.uv.sources]
volucra-django-base = { git = "https://github.com/Cornelicorn/volucra-django-base", rev = "d7b5ae55cef631aaf68a9009b9a74c4678cd2426" }
