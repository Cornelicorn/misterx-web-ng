{% extends "base/base.html" %}
{% load i18n %}

{% block body %}
    <div class="page page-center">
        <div class="container-tight py-4">
            <div class="empty">
                <div class="empty-header">

                    {% block status_code %}
                    {% endblock status_code %}

                </div>
                <p class="empty-title">

                    {% block error_title %}
                    {% endblock error_title %}

                </p>
                <p class="empty-subtitle text-secondary">

                    {% block error_subtitle %}
                    {% endblock error_subtitle %}

                </p>
                <div class="empty-action">

                    {% block action %}
                        <button type="button" class="btn btn-primary" onclick="history.back();">{% trans "Take me back" %}</button>
                    {% endblock action %}

                </div>
            </div>
        </div>
    </div>
{% endblock body %}
